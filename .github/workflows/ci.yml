name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Solo valida que la imagen compila; no publica ni despliega.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: backend-liquidador:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Falla si hay cambios en los modelos sin su archivo de migracion.
      # No necesita base de datos.
      - name: Verificar migraciones pendientes
        run: |
          docker run --rm --entrypoint "" -e SECRET_KEY=ci -e DEBUG=False \
            backend-liquidador:ci python manage.py makemigrations --check --dry-run
